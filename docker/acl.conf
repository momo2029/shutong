%% 服务端账号：订阅设备上行，向设备下发命令。
{allow, {user, "st_server"}, subscribe, ["$SYS/#", "sht/+/status", "sht/+/audio/chunk", "sht/+/image"]}.
{allow, {user, "st_server"}, publish, ["sht/+/cmd", "sht/+/ota"]}.

%% 设备账号：允许所有设备访问自己的 sht/{SN} topic（EMQX 5.x 不支持 %c）
{allow, all, publish, ["sht/+/status", "sht/+/audio/chunk", "sht/+/image"]}.
{allow, all, subscribe, ["sht/+/cmd", "sht/+/ota"]}.

{deny, all}.
