%% 服务端账号：订阅设备上行，向设备下发命令。
{allow, {user, "sht_server"}, subscribe, ["$SYS/#", "sht/+/status", "sht/+/audio/chunk", "sht/+/image"]}.
{allow, {user, "sht_server"}, publish, ["sht/+/cmd", "sht/+/ota"]}.

%% 设备账号：clientid 必须为 SN，只能访问自己的 sht/{SN} topic。
{allow, all, publish, ["sht/%c/status", "sht/%c/audio/chunk", "sht/%c/image"]}.
{allow, all, subscribe, ["sht/%c/cmd", "sht/%c/ota"]}.

{deny, all}.
