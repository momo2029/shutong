services:
  app:
    build:
      context: ../server
      dockerfile: ../docker/Dockerfile.app
    ports:
      - "13000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - MQTT_BROKER=mqtt://emqx:1883
      - QINIU_ACCESS_KEY=${QINIU_ACCESS_KEY:-}
      - QINIU_SECRET_KEY=${QINIU_SECRET_KEY:-}
      - QINIU_BUCKET=${QINIU_BUCKET:-shutong-media}
      - QINIU_DOMAIN=${QINIU_DOMAIN:-}
      - BASE_URL=https://shutong.3198.net
      - ASR_SERVICE_URL=http://asr:8888
      - OCR_API_KEY=${OCR_API_KEY:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_API_URL=${LLM_API_URL:-}
    restart: unless-stopped
    depends_on:
      - emqx
      - asr

  asr:
    build:
      context: ../docker/asr
      dockerfile: Dockerfile.asr
    ports:
      - "8888:8888"
    volumes:
      - ./data/asr-models:/models
    environment:
      - ASR_MODEL_PATH=/models/qwen3-asr-0.6b-int8.gguf
      - ASR_PORT=8888
      - MODEL_URL=${ASR_MODEL_URL:-}
    restart: unless-stopped
    # Increase shared memory for llama.cpp
    shm_size: '2gb'

  emqx:
    image: emqx/emqx:5.7.0
    ports:
      - "1883:1883"
      - "18083:18083"
    volumes:
      - ./data/emqx:/opt/emqx/data
      - ./emqx.conf:/opt/emqx/etc/emqx.conf
    environment:
      - EMQX_NAME=emqx
      - EMQX_HOST=127.0.0.1
    restart: unless-stopped
