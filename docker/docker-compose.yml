services:
  app:
    build:
      context: ../server
      dockerfile: ../docker/Dockerfile.app
    ports:
      - "13000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - MQTT_BROKER=${MQTT_BROKER:-mqtt://emqx:1883}
      - MQTT_USER=${MQTT_USER:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - DEVICE_MASTER_KEY=${DEVICE_MASTER_KEY}
      - EMQX_API_USER=${EMQX_API_USER:-admin}
      - EMQX_API_PASSWORD=${EMQX_API_PASSWORD}

      - QINIU_ACCESS_KEY=${QINIU_ACCESS_KEY:-}
      - QINIU_SECRET_KEY=${QINIU_SECRET_KEY:-}
      - QINIU_BUCKET=${QINIU_BUCKET:-shutong3198}
      - QINIU_DOMAIN=${QINIU_DOMAIN:-shutong3198.3198.net}
      - BASE_URL=https://shutong.3198.net
      - ASR_SERVICE_URL=http://asr:8888
      - OCR_API_KEY=${OCR_API_KEY:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_API_URL=${LLM_API_URL:-}
    restart: unless-stopped
    depends_on:
      - emqx

  asr:
    build:
      context: ../docker/asr
      dockerfile: Dockerfile.asr
    ports:
      - "8888:8888"
    volumes:
      - ./data/asr-models:/models
    environment:
      - ASR_MODEL_PATH=/models/Qwen3-ASR-0.6B-Q8_0.gguf
      - ASR_PORT=8888
    restart: unless-stopped
    shm_size: '2gb'

  emqx:
    image: emqx/emqx:5.7.0
    ports:
      - "1883:1883"
      - "18083:18083"
    volumes:
      - ./data/emqx:/opt/emqx/data
      - ./emqx.conf:/opt/emqx/etc/emqx.conf
    environment:
      - EMQX_NAME=emqx
      - EMQX_HOST=127.0.0.1
    restart: unless-stopped
