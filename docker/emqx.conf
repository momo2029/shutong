## EMQX config for shutong
node {
  cookie = "ad74a4d4a3b6047e3bb07655216ddd91"
  data_dir = "/opt/emqx/data"
}

listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 1024
}

listeners.ws.default {
  bind = "0.0.0.0:8083"
}

dashboard {
  listeners.http {
    bind = "0.0.0.0:18083"
  }
  default_username = "${EMQX_DASHBOARD_USER}"
  default_password = "${EMQX_DASHBOARD_PASSWORD}"
}

authentication = [
  {
    mechanism = password_based
    backend = http
    method = post
    url = "http://app:3000/api/mqtt/auth"
    body {
      username = "${username}"
      password = "${password}"
      clientid = "${clientid}"
    }
    headers {
      "content-type" = "application/json"
    }
    enable = true
  }
]

authorization {
  no_match = deny
  deny_action = disconnect
  sources = [
    {
      type = file
      enable = true
      path = "/opt/emqx/etc/acl.conf"
    }
  ]
}

# 认证由 server/src/routes/mqtt.ts 的 HTTP 回调处理。
