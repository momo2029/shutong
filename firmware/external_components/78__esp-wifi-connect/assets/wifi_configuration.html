<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>书童配网</title>
<style>
body{font-family:sans-serif;background:#1e293b;color:#f8fafc;max-width:400px;margin:40px auto;padding:20px}
h2{color:#4f46e5;text-align:center}
.card{background:#334155;border-radius:8px;padding:16px;margin:12px 0}
input,button{width:100%;padding:10px;margin:4px 0;border-radius:6px;border:none;font-size:14px;box-sizing:border-box}
button{background:#4f46e5;color:#fff;cursor:pointer}
.ssid-item{padding:8px;border-bottom:1px solid #475569;cursor:pointer}
.ssid-item:hover{background:#3b4f6b}
</style>
</head>
<body>
<h2>书童 配网</h2>
<div class="card">
<input id="ssid" placeholder="WiFi名称">
<input id="pass" placeholder="密码" type="password">
<button onclick="c()">连接</button>
</div>
<p id="msg"></p>
<p id="hint" style="color:#94a3b8">正在扫描...</p>
<script>
var x=new XMLHttpRequest();
x.onload=function(){
  var d=JSON.parse(x.responseText);var a=d.aps||[];
  if(a.length){var h='';for(var i=0;i<a.length;i++){if(a[i].ssid){var es=a[i].ssid.replace(/'/g,"\\'");h+='<div class="ssid-item" onclick="document.getElementById(\'ssid\').value=\''+es+'\'">'+a[i].ssid+'</div>';}}
  document.getElementById('hint').innerHTML='附近WiFi';document.getElementById('hint').insertAdjacentHTML('afterend','<div class=card>'+h+'</div>');}
  else document.getElementById('hint').innerHTML='未扫描到WiFi，请手动输入';
};
x.open('GET','/scan');x.send();
function c(){
  var s=document.getElementById('ssid').value;var p=document.getElementById('pass').value;
  if(!s){alert('输入WiFi名称');return}
  document.getElementById('msg').innerHTML='连接中...';
  var y=new XMLHttpRequest();y.onload=function(){document.getElementById('msg').innerHTML='WiFi设置成功'};
  y.open('POST','/submit');y.setRequestHeader('Content-Type','application/json');
  y.send(JSON.stringify({ssid:s,password:p}));
}
</script>
</body>
</html>
